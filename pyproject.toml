[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forkjoin"
version = "0.1.0"
description = "Fork-join queue approximations and simulation"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy", "matplotlib"]

[tool.setuptools]
packages = ["forkjoin"]
